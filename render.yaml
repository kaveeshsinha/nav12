services:
  - type: web
    name: nav12
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 1 --bind 0.0.0.0:$PORT --timeout 60 --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
