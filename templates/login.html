{% extends 'auth.html' %}

{% block head_extra %}
{{ super() }}
{% endblock %}

{% block form %}
<h2 id="form-title">Welcome back.</h2>
<p class="muted">Your garage is waiting. Let's get you in.</p>

<form method="post" action="{{ url_for('login') }}" class="account-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="username">Username</label>
  <input id="username" name="username" placeholder="Your username"
         autocomplete="username" maxlength="30"
         value="{{ request.form.get('username', '') }}" required>

  <label for="password">Password</label>

  <div class="password-field">
    <input id="password" name="password" type="password"
           placeholder="Your password" autocomplete="current-password"
           maxlength="128" required>

    <button id="headlight-toggle"
            class="headlight-toggle"
            type="button"
            aria-label="Show password"
            aria-controls="password"
            aria-pressed="false"
            title="Show password"
            hidden>
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <!-- Headlight housing -->
        <path d="M19 7 C25 7 29 11 29 16
                 C29 21 25 25 19 25 Z"/>
        <!-- Headlight lens -->
        <path d="M22 10 C25 13 25 19 22 22"/>
        <!-- Light beams -->
        <g class="light-beams">
          <path d="M3 7 L14 10"/>
          <path d="M2 13 L14 14"/>
          <path d="M2 19 L14 18"/>
          <path d="M3 25 L14 22"/>
        </g>
      </svg>
    </button>
  </div>

  <a class="forgot-password-link" href="{{ url_for('recovery.forgot_password') }}">Forgot password?</a>

  <button class="primary" type="submit">
    Enter your garage <span>↗</span>
  </button>
</form>

<p class="switch">
  New to NaV12?
  <a href="{{ url_for('signup') }}">Create an account</a>
</p>
<div class="panel-foot">BUILT FOR PEOPLE WHO LOVE CARS.</div>
{% endblock %}
