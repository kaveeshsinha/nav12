/* ===== FLOATING CAR BRAND MENU ===== */

.dashboard-layout{
    position:relative;
    display:block;
}

/* Keep normal dashboard position */
.dashboard-layout .dashboard{
    margin-left:auto;
    margin-right:auto;
}

/* Floating sidebar */
.car-sidebar{
    position:absolute;
    top:35px;
    left:0;

    width:55px;
    max-height:500px;

    background:#101518;
    border:1px solid var(--line);
    border-left:0;

    padding:18px 8px;

    overflow:hidden;
    white-space:nowrap;

    z-index:100;

    transition:width 0.25s ease;
}

/* Expand on hover */
.car-sidebar:hover{
    width:210px;
}

/* Heading */
.car-sidebar h3{
    color:var(--accent);
    font-size:10px;
    letter-spacing:1.5px;

    margin:0 0 15px;
    padding-left:5px;
}

/* Hide company names normally */
.car-sidebar a{
    display:block;

    padding:10px 12px;

    color:var(--text);
    font-size:13px;

    opacity:0;
    transform:translateX(-10px);

    transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
}

/* Reveal names */
.car-sidebar:hover a{
    opacity:1;
    transform:translateX(0);
}

/* Individual car hover */
.car-sidebar a:hover{
    background:rgba(255,255,255,0.07);
    color:var(--accent);
}


/* Mobile */
@media(max-width:800px){

    .car-sidebar{
        position:relative;
        top:auto;
        left:auto;

        width:100%;
        max-height:none;

        display:flex;
        overflow-x:auto;

        padding:12px;
    }

    .car-sidebar:hover{
        width:100%;
    }

    .car-sidebar h3{
        display:none;
    }

    .car-sidebar a{
        opacity:1;
        transform:none;
        white-space:nowrap;
    }
}

}

/* Menu icon */

/* Completely collapse car links */
.car-sidebar a{

    color:var(--text);
    font-size:13px;

    opacity:0;

    transform:translateX(-8px);

    transition:
        opacity .18s ease,
        transform .18s ease,
        background .15s ease,
        color .15s ease;
}

/* Expand menu */
.car-sidebar:hover{
    width:220px !important;
    height:auto;
    max-height:500px;

    border-radius:22px;
    corner-shape:squircle;

    box-shadow:

    transform:translateY(-1px);
}

/* Show title when expanded */

    width:100%;
    justify-content:flex-start;
    padding-left:16px;

    font-size:10px;
    letter-spacing:2px;
}

/* Remove hamburger while expanded */


/* Reveal brands */
.car-sidebar:hover a{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
}

.car-sidebar a:hover{
    background:#171d21;
    color:var(--accent);
}

/* Mobile */
@media(max-width:800px){

    .car-sidebar{
        position:relative !important;
        top:auto;
        width:48px !important;
    }

    .dashboard-layout .dashboard{
        margin:0 auto !important;
    }
